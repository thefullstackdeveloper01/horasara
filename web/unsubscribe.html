<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Manage Subscription | HoraSaar</title><meta name="description" content="Manage or cancel your HoraSaar daily report subscription."><meta name="robots" content="noindex,nofollow"><link rel="canonical" href="__PUBLIC_BASE_URL__/unsubscribe"><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/assets/horasaar.css"><script src="/assets/horasaar.js" defer></script></head>
<body><div class="app-shell"><header class="topbar"><a class="brand" href="/"><span class="brand-mark">ॐ</span><span class="brand-copy"><strong>HoraSaar</strong><span>Manage Subscription</span></span></a><nav class="desktop-main-nav" aria-label="Primary navigation"></nav><div class="top-actions"><div class="language-wrap"><button class="lang-btn" id="languageToggle" type="button" aria-expanded="false"><i data-lucide="languages"></i><span id="languageShort">EN</span></button><div class="language-menu" id="languageMenu"><input id="languageSearch" class="language-search" placeholder="Search language"><div id="languageItems"></div></div></div><button class="icon-btn" id="theme" type="button"><i data-lucide="moon"></i></button><a class="btn secondary" href="/">Dashboard</a></div></header><main class="page tool-page"><section class="hero"><div><span class="eyebrow">Subscription management</span><h1>Manage your daily report.</h1><p id="statusText">Checking your subscription…</p></div><div class="hero-side"><div class="motto">Your schedule. Your topics. Your control.</div></div></section><section class="tool-card"><div id="details" class="info-strip"><i data-lucide="loader-circle"></i><span>Loading subscription details…</span></div><div class="actions"><button id="cancel" class="btn primary" type="button" disabled><i data-lucide="bell-off"></i> Cancel subscription</button><a class="btn secondary" href="/subscribe">Change plan</a></div></section><footer class="footer"><nav><a href="/">Home</a><a href="/subscribe">Subscribe</a></nav>HoraSaar · Subscription management</footer></main></div><script>const q=new URLSearchParams(location.search),id=q.get('id'),token=q.get('token'),s=document.getElementById('statusText'),d=document.getElementById('details'),b=document.getElementById('cancel');let valid=false;fetch('/subscriptions/manage?id='+encodeURIComponent(id||'')+'&token='+encodeURIComponent(token||'')).then(r=>r.json()).then(x=>{if(x.error)throw Error(x.message);valid=true;s.textContent=`Active ${x.frequency||'daily'} subscription for ${x.name||'subscriber'}.`;d.innerHTML='<i data-lucide="check-circle-2"></i><span>Selected report topics are delivered at the configured daily time. Your subscription can be cancelled here.</span>';b.disabled=false;lucide.createIcons()}).catch(e=>s.textContent=e.message);b.onclick=async()=>{if(!valid)return;b.disabled=true;const r=await fetch('/subscriptions/unsubscribe?id='+encodeURIComponent(id||'')+'&token='+encodeURIComponent(token||''),{method:'POST'}),x=await r.json();s.textContent=r.ok?'Subscription cancelled successfully.':(x.message||x.error||'Unable to cancel subscription');d.innerHTML='<i data-lucide="info"></i><span>'+s.textContent+'</span>';lucide.createIcons()};</script></body></html>
